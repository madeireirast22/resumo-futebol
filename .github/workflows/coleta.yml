# O robô coletor, na nuvem.
#
# Roda no GitHub Actions deste repositório (público, logo minutos ilimitados e
# de graça) mas trabalha em cima do repositório PRIVADO `base-futebol`, que
# clona com um token guardado nos segredos. A SofaScore bloqueia IP de
# datacenter, então TODA requisição sai pelo proxy residencial — o navegador
# é aberto já com o proxy, e o GitHub nunca aparece para a fonte.
#
# Horários em UTC: 11:00 = 08:00 de Brasília, 02:30 = 23:30 de Brasília.
# O GitHub pode atrasar o cron em alguns minutos nos horários de pico.
#
# Segredos necessários (Settings → Secrets and variables → Actions):
#   BASE_TOKEN  token fine-grained com Contents (read/write) e Issues (read/write)
#               no repositório base-futebol
#   PROXY_JSON  o conteúdo inteiro do arquivo .proxy.json

name: coleta diaria

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:

# Nunca duas coisas mexendo na SofaScore e no espelho ao mesmo tempo. O vigia
# de escalação entra no mesmo grupo: se cair no meio de uma coleta, espera.
concurrency:
  group: sofascore
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: America/Sao_Paulo
      BASE_TOKEN: ${{ secrets.BASE_TOKEN }}
    steps:
      - name: Base privada (código + dados)
        uses: actions/checkout@v4
        with:
          repository: madeireirast22/base-futebol
          token: ${{ secrets.BASE_TOKEN }}
          path: base
          fetch-depth: 1

      - name: Espelho público (este repositório)
        uses: actions/checkout@v4
        with:
          path: base/espelho-publico
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: base/package-lock.json

      - name: Dependências
        working-directory: base
        run: npm ci --omit=dev

      - name: Proxy e identidade do git
        working-directory: base
        run: |
          printf '%s' "$PROXY_JSON" > .proxy.json
          git config user.name robo-coletor
          git config user.email caiquevileladiniz@gmail.com
        env:
          PROXY_JSON: ${{ secrets.PROXY_JSON }}

      # O espelho é a verdade da camada viva: o vigia (a cada 15 min) grava
      # escalação só lá. Trago de volta antes de regenerar, senão o proximos.mjs
      # sobrescreve a confirmada que o vigia conseguiu.
      - name: Camada viva vem do espelho
        working-directory: base
        run: |
          mkdir -p resumo/json
          [ -f espelho-publico/proximos.json ] && cp espelho-publico/proximos.json resumo/json/ || true
          [ -d espelho-publico/escalacoes ] && rm -rf resumo/json/escalacoes && cp -r espelho-publico/escalacoes resumo/json/ || true

      - name: Coleta, scout, resumo, publica
        working-directory: base
        run: node diario.mjs
