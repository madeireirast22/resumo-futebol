# O vigia da escalação confirmada, na nuvem.
#
# A cada 15 minutos: lê proximos.json (daqui, do espelho), e para cada jogo a
# menos de 90 min do apito sem escalação confirmada pede a escalação à
# SofaScore, via proxy residencial. Guarda a prevista e a confirmada em
# escalacoes/<eventoId>.json e empurra só isso (modo --parcial do espelho).
#
# Da base privada só vêm os scripts (checkout esparso, sem os 125 MB de
# dados): o vigia não precisa da base, só do proximos.json que já está aqui.
#
# Na maior parte das execuções não há jogo perto e o script sai em 1 s.

name: escalacao confirmada

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: sofascore
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Scripts da base privada
        uses: actions/checkout@v4
        with:
          repository: madeireirast22/base-futebol
          token: ${{ secrets.BASE_TOKEN }}
          path: base
          fetch-depth: 1
          sparse-checkout: |
            *.mjs
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false

      - name: Espelho público (este repositório)
        uses: actions/checkout@v4
        with:
          path: base/espelho-publico
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: base/package-lock.json

      - name: Dependências
        working-directory: base
        run: npm ci --omit=dev

      - name: Proxy e camada viva
        working-directory: base
        run: |
          printf '%s' "$PROXY_JSON" > .proxy.json
          mkdir -p resumo/json
          cp espelho-publico/proximos.json resumo/json/
          cp -r espelho-publico/escalacoes resumo/json/
        env:
          PROXY_JSON: ${{ secrets.PROXY_JSON }}

      - name: Vigia
        working-directory: base
        run: node escalacoes.mjs
